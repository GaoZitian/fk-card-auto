name: 免费名片赞自动领取

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: 安装 Playwright
        run: |
          npm install playwright-core
          npx playwright install chromium
      
      - name: 运行领取脚本
        id: claim
        env:
          QQ_NUMBER: ${{ secrets.QQ_NUMBER }}
        run: |
          node claim.js
          
      - name: 检查结果
        if: always()
        run: |
          echo "=== 结果汇总 ==="
          echo "QQ: ${{ secrets.QQ_NUMBER }}"
          echo "退出码: ${{ job.status }}"
