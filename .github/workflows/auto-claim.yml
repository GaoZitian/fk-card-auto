name: 免费名片赞自动领取

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Playwright
        run: |
          npm install playwright
          npx playwright install chromium
      
      - name: 运行领取脚本
        run: node claim.js
