name: 免费名片赞自动领取

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 获取页面并提交订单
        id: claim
        env:
          UA: 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.4 Mobile/15E148 Safari/604.1'
        run: |
          COOKIE_JAR="cookies.txt"
          BASE="https://fk.555655.cn"
          
          echo "=== 步骤 1: 访问首页 ==="
          curl -sL --compressed --max-time 15 -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -H "User-Agent: $UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh-Hans;q=0.9" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Connection: keep-alive" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            "$BASE/" -o /dev/null
          
          echo "Cookie after homepage:"
          cat "$COOKIE_JAR"
          
          echo ""
          echo "=== 步骤 2: 访问商品页 ==="
          curl -sL --compressed --max-time 15 -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -H "User-Agent: $UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh-Hans;q=0.9" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Connection: keep-alive" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            -H "Referer: $BASE/" \
            "$BASE/?cid=3&tid=48" -o page.html
          
          echo "Cookie after product page:"
          cat "$COOKIE_JAR"
          
          echo ""
          echo "=== 步骤 3: 提取 hashsalt ==="
          # 检查页面是否包含 hashsalt
          if grep -q "hashsalt" page.html; then
            HASH_CODE=$(grep -o "var hashsalt=[^;]*;" page.html | sed 's/var hashsalt=//;s/;//' | head -1)
            echo "混淆代码: $HASH_CODE"
            
            if [ -n "$HASH_CODE" ]; then
              HASH_SALT=$(node -e "console.log($HASH_CODE)")
              echo "解码结果: $HASH_SALT"
            else
              echo "❌ 混淆代码为空"
              HASH_SALT=""
            fi
          else
            echo "❌ 页面中未找到 hashsalt"
            echo "页面内容前 500 字符:"
            head -c 500 page.html
            HASH_SALT=""
          fi
          
          echo ""
          echo "=== 步骤 4: 提交订单 ==="
          if [ -n "$HASH_SALT" ]; then
            RESPONSE=$(curl -s --compressed -X POST "$BASE/ajax.php?act=pay" \
              -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Origin: $BASE" \
              -H "Referer: $BASE/?cid=3&tid=48" \
              -H "User-Agent: $UA" \
              -H "Accept: application/json, text/javascript, */*; q=0.01" \
              -H "Accept-Language: zh-CN,zh-Hans;q=0.9" \
              -H "Accept-Encoding: gzip, deflate, br" \
              -H "Connection: keep-alive" \
              -H "Sec-Fetch-Dest: empty" \
              -H "Sec-Fetch-Site: same-origin" \
              -H "Sec-Fetch-Mode: cors" \
              -d "tid=48&inputvalue=${{ secrets.QQ_NUMBER }}&num=1&hashsalt=$HASH_SALT")
            
            echo "响应: $RESPONSE"
            echo "result=$RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "❌ 无法提交订单：hashsalt 为空"
            echo "result={\"code\":-1,\"msg\":\"hashsalt 提取失败\"}" >> $GITHUB_OUTPUT
          fi
          
      - name: 显示结果
        run: |
          RESPONSE="${{ steps.claim.outputs.result }}"
          echo "最终响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"succ":1\|"code":1'; then
            echo "✅ 领取成功！"
          elif echo "$RESPONSE" | grep -q '"code":4'; then
            echo "❌ 需要登录"
          elif echo "$RESPONSE" | grep -q '"code":2'; then
            echo "🔒 需要验证码"
          elif echo "$RESPONSE" | grep -q '"code":-1'; then
            echo "⚠️ 验证失败"
          else
            echo "⚠️ 其他结果: $RESPONSE"
          fi
