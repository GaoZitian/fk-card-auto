name: 免费名片赞自动领取

on:
  schedule:
    - cron: '0 8 * * *'  # 每天早上 8 点运行（UTC 时间）
  workflow_dispatch:     # 允许手动触发

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: 获取页面并提取 hashsalt（保持 cookie）
        id: get_hashsalt
        run: |
          echo "=== 步骤 1: 获取页面并保存 cookie ==="
          curl -sL --max-time 15 -c cookies.txt -b cookies.txt \
            "https://fk.555655.cn/?cid=3&tid=48" -o page.html
          
          echo "=== 步骤 2: 提取混淆代码 ==="
          HASH_CODE=$(grep -o "var hashsalt=[^;]*;" page.html | sed 's/var hashsalt=//;s/;//')
          echo "混淆代码: $HASH_CODE"
          
          echo "=== 步骤 3: 解码 hashsalt ==="
          HASH_SALT=$(node -e "console.log($HASH_CODE)")
          echo "解码结果: $HASH_SALT"
          
          echo "=== 步骤 4: 提交订单（携带 cookie）==="
          RESPONSE=$(curl -s -X POST "https://fk.555655.cn/ajax.php?act=pay" \
            -c cookies.txt -b cookies.txt \
            -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Origin: https://fk.555655.cn" \
            -H "Referer: https://fk.555655.cn/?cid=3&tid=48" \
            -d "tid=48&inputvalue=${{ secrets.QQ_NUMBER }}&inputvalue2=&inputvalue3=&inputvalue4=&inputvalue5=&num=1&hashsalt=$HASH_SALT")
          
          echo "响应: $RESPONSE"
          
          # 保存结果到环境变量
          echo "result=$RESPONSE" >> $GITHUB_OUTPUT
          
      - name: 显示结果
        run: |
          RESPONSE="${{ steps.get_hashsalt.outputs.result }}"
          echo "最终响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"succ":1\|"code":1'; then
            echo "✅ 领取成功！"
          elif echo "$RESPONSE" | grep -q '"code":4'; then
            echo "❌ 需要登录"
          elif echo "$RESPONSE" | grep -q '"code":2'; then
            echo "🔒 需要验证码"
          elif echo "$RESPONSE" | grep -q '"code":-1'; then
            echo "⚠️ 验证失败，可能需要登录或验证码"
          else
            echo "⚠️ 其他结果: $RESPONSE"
          fi
